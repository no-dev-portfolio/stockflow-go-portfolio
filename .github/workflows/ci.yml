name: StockFlow checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: stockflow
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: stockflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stockflow -d stockflow_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://stockflow:local-test-only@localhost:5432/stockflow_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - run: npm ci && npm run build && npm test && npm audit
        working-directory: web
      - run: sh scripts/check.sh
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: docker build --target demo -t stockflow:ci .
